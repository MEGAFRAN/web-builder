name: Deploy Client

on:
  workflow_dispatch:
    inputs:
      clientId:
        description: 'Client ID to rebuild (e.g. restaurante-pepe)'
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    name: Build and Deploy ${{ github.event.inputs.clientId }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Derive client key
        run: echo "CLIENT_KEY=$(echo '${{ github.event.inputs.clientId }}' | tr '-' '_')" >> $GITHUB_ENV

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ github.event.inputs.clientId }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            nextjs-${{ github.event.inputs.clientId }}-

      - name: Build static site
        env:
          BOOKING_API_URL: ${{ vars.ADMIN_API_URL }}
        run: |
          CLIENT_ID="${{ github.event.inputs.clientId }}"
          if [ -z "$BOOKING_API_URL" ]; then
            echo "::error::ADMIN_API_URL repository variable is not set. Add it under Settings → Secrets and variables → Actions → Variables (same Azure Functions base URL used by deploy-admin.yml)."
            exit 1
          fi
          BOOKING_SERVICES_ENDPOINT=$(node -e "
            const fs = require('fs');
            const path = require('path');
            const file = path.join('config', 'clients', process.argv[1], 'client.json');
            try {
              const cfg = JSON.parse(fs.readFileSync(file, 'utf8'));
              process.stdout.write(typeof cfg.bookingServicesEndpoint === 'string' ? cfg.bookingServicesEndpoint : '');
            } catch {
              process.stdout.write('');
            }
          " "$CLIENT_ID")
          {
            echo "CLIENT_ID=$CLIENT_ID"
            echo "NEXT_PUBLIC_BOOKING_API_URL=$BOOKING_API_URL"
            if [ -n "$BOOKING_SERVICES_ENDPOINT" ]; then
              echo "NEXT_PUBLIC_BOOKING_SERVICES_ENDPOINT=$BOOKING_SERVICES_ENDPOINT"
            fi
          } > .env.local
          npm run build:blob

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets[format('SWA_TOKEN_{0}', env.CLIENT_KEY)] }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: /
          output_location: out