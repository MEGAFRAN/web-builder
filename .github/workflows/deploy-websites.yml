name: Deploy Website to Blob Storage

on:
  workflow_dispatch:
    inputs:
      clientId:
        description: 'Client ID to rebuild (example: test)'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    name: Build and Deploy ${{ github.event.inputs.clientId }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Restore Next.js build cache
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: nextjs-${{ github.event.inputs.clientId }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            nextjs-${{ github.event.inputs.clientId }}-

      - name: Build static site
        env:
          BOOKING_API_URL: ${{ vars.ADMIN_API_URL }}
        run: |
          CLIENT_ID="${{ github.event.inputs.clientId }}"
          if [ -z "$BOOKING_API_URL" ]; then
            echo "::error::ADMIN_API_URL repository variable is not set. Add it under Settings → Secrets and variables → Actions → Variables (same Azure Functions base URL used by deploy-admin.yml)."
            exit 1
          fi
          BOOKING_SERVICES_ENDPOINT=$(node -e "
            const fs = require('fs');
            const path = require('path');
            const file = path.join('config', 'clients', process.argv[1], 'client.json');
            try {
              const cfg = JSON.parse(fs.readFileSync(file, 'utf8'));
              process.stdout.write(typeof cfg.bookingServicesEndpoint === 'string' ? cfg.bookingServicesEndpoint : '');
            } catch {
              process.stdout.write('');
            }
          " "$CLIENT_ID")
          {
            echo "CLIENT_ID=$CLIENT_ID"
            echo "NEXT_PUBLIC_BOOKING_API_URL=$BOOKING_API_URL"
            if [ -n "$BOOKING_SERVICES_ENDPOINT" ]; then
              echo "NEXT_PUBLIC_BOOKING_SERVICES_ENDPOINT=$BOOKING_SERVICES_ENDPOINT"
            fi
          } > .env.local
          npm run build:blob

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Discover Storage Account via Azure Tags
        id: discover
        run: |
          # 1. Explicitly set the subscription context
          az account set --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    
          # 2. Check current identity
          echo "Logged in as:"
          az ad signed-in-user show --query userPrincipalName -o tsv || echo "Service Principal Used"

          # 3. List ALL accounts this identity can see (for debugging)
          echo "Accounts visible to this Service Principal:"
          az storage account list --query "[].name" -o tsv

          # 4. Run your actual query
          INPUT_ID="${{ github.event.inputs.clientId }}"
          STORAGE_ACCOUNT=$(az storage account list \
            --query "[?tags.client_id=='$INPUT_ID' || tags.team_id=='$INPUT_ID'].name | [0]" \
            -o tsv)

          if [ -z "$STORAGE_ACCOUNT" ]; then
            echo "::error::No Storage Account found for ID '$INPUT_ID'"
            exit 1
          fi
          
          echo "STORAGE_ACCOUNT=$STORAGE_ACCOUNT" >> "$GITHUB_ENV"
          echo "Successfully resolved '$INPUT_ID' to account: $STORAGE_ACCOUNT"

      - name: Deploy to Azure Blob Storage
        run: |
          # Exclude root images/ from sync so blob-managed assets there are not overwritten
          # or deleted when ./out omits or differs from storage (--exclude-path is prefix match).
          az storage blob sync \
            --account-name "${{ env.STORAGE_ACCOUNT }}" \
            --container '$web' \
            --source "./out" \
            --delete-destination true \
            --exclude-path images \
            --auth-mode login