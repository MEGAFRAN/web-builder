name: Deploy Client

on:
  workflow_dispatch:
    inputs:
      clientId:
        description: 'Client ID to rebuild (e.g. restaurante-pepe)'
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    name: Build and Deploy ${{ github.event.inputs.clientId }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Derive client key
        run: echo "CLIENT_KEY=$(echo '${{ github.event.inputs.clientId }}' | tr '-' '_')" >> $GITHUB_ENV

      - name: Restore Next.js build cache
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: nextjs-${{ github.event.inputs.clientId }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            nextjs-${{ github.event.inputs.clientId }}-

      - name: Resolve client build mode
        id: client
        run: |
          CLIENT_ID="${{ github.event.inputs.clientId }}"
          BOOKING_ENABLED=$(node -e "
            const fs = require('fs');
            const path = require('path');
            const file = path.join('config', 'clients', process.argv[1], 'client.json');
            try {
              const cfg = JSON.parse(fs.readFileSync(file, 'utf8'));
              process.stdout.write(cfg.features?.booking === true ? 'true' : 'false');
            } catch {
              process.stdout.write('false');
            }
          " "$CLIENT_ID")
          echo "booking_enabled=$BOOKING_ENABLED" >> "$GITHUB_OUTPUT"
          echo "Client $CLIENT_ID — features.booking=$BOOKING_ENABLED"

      - name: Build static site
        env:
          BOOKING_API_URL: ${{ vars.ADMIN_API_URL }}
          COMPANY_PROFILE_BUILD_TOKEN: ${{ secrets.COMPANY_PROFILE_BUILD_TOKEN }}
        run: |
          CLIENT_ID="${{ github.event.inputs.clientId }}"
          if [ "${{ steps.client.outputs.booking_enabled }}" = "true" ]; then
            if [ -z "$BOOKING_API_URL" ]; then
              echo "::error::features.booking=true requires ADMIN_API_URL repository variable. Add it under Settings → Secrets and variables → Actions → Variables (same Azure Functions base URL used by deploy-admin-swa.yml)."
              exit 1
            fi
            if [ -z "$COMPANY_PROFILE_BUILD_TOKEN" ]; then
              echo "::error::features.booking=true requires COMPANY_PROFILE_BUILD_TOKEN secret. Add the same bearer token configured on the Azure Function App under Settings → Secrets and variables → Actions → Secrets."
              exit 1
            fi
            BOOKING_SERVICES_ENDPOINT=$(node -e "
              const fs = require('fs');
              const path = require('path');
              const file = path.join('config', 'clients', process.argv[1], 'client.json');
              try {
                const cfg = JSON.parse(fs.readFileSync(file, 'utf8'));
                process.stdout.write(typeof cfg.bookingServicesEndpoint === 'string' ? cfg.bookingServicesEndpoint : '');
              } catch {
                process.stdout.write('');
              }
            " "$CLIENT_ID")
            {
              echo "CLIENT_ID=$CLIENT_ID"
              echo "NEXT_PUBLIC_CLIENT_ID=$CLIENT_ID"
              echo "NEXT_PUBLIC_BOOKING_API_URL=$BOOKING_API_URL"
              echo "NEXT_PUBLIC_TELEMETRY_URL=${BOOKING_API_URL%/}/telemetry"
              echo "COMPANY_PROFILE_BUILD_TOKEN=$COMPANY_PROFILE_BUILD_TOKEN"
              if [ -n "$BOOKING_SERVICES_ENDPOINT" ]; then
                echo "NEXT_PUBLIC_BOOKING_SERVICES_ENDPOINT=$BOOKING_SERVICES_ENDPOINT"
              fi
            } > .env.local
          else
            {
              echo "CLIENT_ID=$CLIENT_ID"
              echo "NEXT_PUBLIC_CLIENT_ID=$CLIENT_ID"
            } > .env.local
          fi
          npm run build:blob

      - name: Seed tenant booking settings in Cosmos
        if: steps.client.outputs.booking_enabled == 'true'
        env:
          CLIENT_ID: ${{ github.event.inputs.clientId }}
          COSMOS_ENDPOINT: ${{ secrets.COSMOS_ENDPOINT }}
          COSMOS_KEY: ${{ secrets.COSMOS_KEY }}
        run: |
          if [ -z "$COSMOS_ENDPOINT" ] || [ -z "$COSMOS_KEY" ]; then
            echo "Skipping booking-settings seed: COSMOS_ENDPOINT or COSMOS_KEY not configured."
            exit 0
          fi
          npm ci --prefix azure-functions
          NODE_PATH=azure-functions/node_modules node scripts/seed-tenant-booking-settings.mjs

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets[format('SWA_TOKEN_{0}', env.CLIENT_KEY)] }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: out
          skip_app_build: true
          skip_api_build: true
