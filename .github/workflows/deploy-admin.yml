name: Deploy Admin SPA

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    name: Build and Deploy Admin SPA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate deploy configuration
        env:
          SWA_TOKEN: ${{ secrets.SWA_TOKEN_ADMIN }}
        run: |
          ADMIN_API_URL="${{ vars.ADMIN_API_URL }}"
          if [ -z "$ADMIN_API_URL" ]; then
            echo "::error::ADMIN_API_URL is not set. Add the ADMIN_API_URL repository variable under Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi
          if [ -z "$SWA_TOKEN" ]; then
            echo "::error::SWA_TOKEN_ADMIN secret is not set. In Azure Portal, open the admin Static Web App → Manage deployment token, then add the token as SWA_TOKEN_ADMIN under Settings → Secrets and variables → Actions → Secrets."
            exit 1
          fi
          echo "NEXT_PUBLIC_ADMIN_API_URL=$ADMIN_API_URL" >> "$GITHUB_ENV"
          echo "CLIENT_ID=${{ vars.ADMIN_BUILD_CLIENT_ID || '1' }}" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Restore Next.js build cache
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: nextjs-admin-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            nextjs-admin-

      - name: Build admin SPA
        run: npm run build:admin

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_TOKEN_ADMIN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: /
          output_location: out
