name: Deploy Admin SPA

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    name: Build and Deploy Admin SPA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Derive client key
        run: echo "CLIENT_KEY=ADMIN" >> $GITHUB_ENV

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-admin-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            nextjs-admin-

      - name: Build admin SPA
        env:
          NEXT_PUBLIC_ADMIN_API_URL: ${{ vars.ADMIN_API_URL }}
          CLIENT_ID: ${{ vars.ADMIN_BUILD_CLIENT_ID }}
        run: npm run build:admin

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets[format('SWA_TOKEN_{0}', env.CLIENT_KEY)] }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: /
          output_location: out
